name: collect-apk

# Build the shipping debug APK and commit it to the claude/apk branch so it can
# be pulled out of the repo over git (the only egress the coordinator has).
# Triggers on push of this file to a claude/** branch (workflow_dispatch needs
# the default branch; push does not).

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/collect-apk.yml']

permissions:
  contents: write

concurrency:
  group: collect-apk-${{ github.repository }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: Collect, split if needed, publish to claude/apk
        run: |
          set -euo pipefail
          mkdir -p apkout
          i=0
          while IFS= read -r -d '' f; do
            cp "$f" "apkout/$(basename "$f")"; i=$((i+1))
          done < <(find . -path '*/build/outputs/apk/*' -name '*.apk' ! -name '*androidTest*' -print0)
          echo "collected $i apk(s)"; test "$i" -gt 0
          ( cd apkout
            for a in *.apk; do
              sz=$(wc -c < "$a")
              if [ "$sz" -gt 99000000 ]; then split -b 95M -d "$a" "$a.part"; rm -f "$a"; fi
            done
            ls -la; sha256sum * > SHA256SUMS )
          git config user.name relay-bot
          git config user.email noreply@github.com
          git checkout --orphan claude/apk 2>/dev/null || git checkout claude/apk
          git reset
          git add -f apkout
          git commit -qm "debug apk build" || true
          git push -f origin claude/apk
