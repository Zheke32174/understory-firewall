# Godwall subsystem — i2pd (Purple I2P) configuration
#
# PROVENANCE / LICENCE. The option set and defaults mirror InviZible Pro's
# preferences_i2pd (github.com/Gedsh/InviZible, GPL-3.0). i2pd itself is
# © The PurpleI2P team, BSD-3-Clause. Configuration derived from the donor's
# option surface, not copied code. A NOTICE entry for the i2pd binary +
# InviZible-derived config is required before this ships — see
# .octo/parallel/WP-4/output.md.
#
# COMPLETE, working default (charter rule C). Seeded into the prefix ONCE with
# overwrite=false so an Advanced raw edit survives a restart.
# I2pdSettings.renderI2pdConf() reproduces this CONFIGURATION (same keys and
# values) for the default settings and regenerates it when a preference changes;
# the regenerated form is machine-authored and drops these teaching comments. The
# two are kept semantically in lock-step, not byte-identical.
#
# Inert until usr/bin/i2pd is present; absent binary => Anonymity reports ABSENT.
# The data directory is passed on argv (--datadir) by the ServiceSpec so the
# daemon and the Supervisor agree on one location; it is not repeated here.

## Logging
log = file
logfile = /data/local/tmp/godwall/logs/i2pd.log
loglevel = warn

## Common settings (preferences_i2pd > "Common settings") — donor defaults
ipv4 = true
ipv6 = true
notransit = false
floodfill = false
bandwidth = L
share = 20

[ntcp2]
enabled = true

[ssu2]
enabled = false

# Web console — loopback only, not exposed as a donor preference. Status surface.
[http]
enabled = true
address = 127.0.0.1
port = 7070

# HTTP proxy (preferences_i2pd > "HTTP proxy")
[httpproxy]
enabled = true
address = 127.0.0.1
port = 4444
# HTTP outproxy — off by default (gateway to the clearnet via an .i2p outproxy):
#outproxy = http://false.i2p

# SOCKS proxy (preferences_i2pd > "Socks proxy")
[socksproxy]
enabled = true
address = 127.0.0.1
port = 4447
# SOCKS outproxy — off by default:
#outproxy.enabled = true
#outproxy = 127.0.0.1
#outproxyport = 9050

# SAM bridge (preferences_i2pd > "SAM interface") — off by default
[sam]
enabled = false
address = 127.0.0.1
port = 7656

# UPnP (preferences_i2pd > "UPNP")
[upnp]
enabled = true

# Reseeding (preferences_i2pd > "Reseeding")
[reseed]
verify = true

# Limits (preferences_i2pd > "Limits")
[limits]
transittunnels = 10
openfiles = 500
coresize = 0

# Address book (preferences_i2pd > "Address book")
[addressbook]
defaulturl = http://shx5vqsw7usdaunyzr2qmes2fq37oumybpudrd4jjj4e4vk4uusa.b32.i2p/hosts.txt

# Cryptography (preferences_i2pd > "Cryptography")
[precomputation]
elgamal = true
