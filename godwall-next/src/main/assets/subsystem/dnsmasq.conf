# dnsmasq — Godwall subsystem local DNS cache, rebind guard, and no-leak front-end
#
# WP-3 (DNS stack). Seeded once into the prefix at
#   /data/local/tmp/godwall/usr/etc/dnsmasq.conf
# by the Supervisor on first start, then left alone so an Advanced-surface edit survives.
#
# Topology:  tun -> 127.0.0.1:5353 (this) -> 127.0.0.1:5354 (dnscrypt-proxy) -> encrypted
# This is the front door: it caches, rejects DNS-rebinding answers, and forwards EVERY query
# to the encrypted resolver. There is no plaintext upstream, so a query it handles cannot
# silently egress in cleartext — if dnscrypt-proxy is down it returns SERVFAIL, it does not
# leak. It answers only the traffic Godwall's tun hands it; it is not a LAN DNS server.
#
# Runs as uid 2000 out of Godwall's own prefix. dnsmasq is started with --keep-in-foreground
# (see DnsServices.kt) so it does NOT daemonise — the Supervisor tracks the pid it launched.

# --- Listener ----------------------------------------------------------------------------
# Loopback only, on 5353. bind-interfaces (not the default wildcard bind) so dnsmasq opens a
# socket only on 127.0.0.1 and never answers on any other interface. No dhcp-range is set, so
# the DHCP and TFTP servers stay off — this is a resolver only.
listen-address=127.0.0.1
port=5353
bind-interfaces

# --- Upstream: the encrypted resolver, and nothing else ----------------------------------
# no-resolv: never read a system /etc/resolv.conf (which on Android would be a network-set,
# plaintext DNS). The single upstream below is the only place queries go.
no-resolv
server=127.0.0.1#5354

# --- DNS rebind protection (InviZible "DNS rebinding protection") -------------------------
# Reject upstream answers that map a public name to a private/loopback/link-local address —
# the core primitive of a DNS-rebinding attack, where a public site's DNS is made to resolve
# to an address on your LAN so a browser can reach it under the site's origin.
stop-dns-rebind
# ...but allow 127.0.0.0/8, so Godwall's own loopback services still resolve.
rebind-localhost-ok
# Example carve-out for a domain that legitimately points at a private IP (a local router UI):
#   rebind-domain-ok=/router.example/

# --- Leak / hygiene guards ---------------------------------------------------------------
# Never forward reverse lookups for private (RFC1918) ranges upstream — they would leak your
# internal addressing to the resolver and only ever return errors anyway.
bogus-priv
# Never forward a name that has no dot / no domain part upstream.
domain-needed
# Do not read /etc/hosts; this resolver's job is forwarding, not local host mapping.
no-hosts

# --- Cache -------------------------------------------------------------------------------
cache-size=4096
# Do not extend negative (NXDOMAIN) caching beyond what the record specifies — a blocklist
# change (WP-6) should take effect promptly, not be masked by a long-lived cached "no".
no-negcache

# --- Logging -----------------------------------------------------------------------------
# Off by default (charter: logging is the user's explicit choice). To debug, an Advanced-surface
# edit can add `log-queries` and `log-facility=-` (stderr, which the Supervisor captures).
